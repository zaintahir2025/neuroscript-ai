version: '3.8'

services:
  proxy:
    build:
      context: ./NeuroScriptProxy
      dockerfile: Dockerfile
    container_name: neuroscript-proxy
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - NEUROSCRIPT_PROXY_API_KEY=neuroscript-dev-api-key-2026
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
